version: "3.8"

services:
  tips-beauty-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tips_beauty_app
    ports:
      - "8081:8081"
      - "3000:3000"
    environment:
      - EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
      - EXPO_PUBLIC_EAS_PROJECT_ID=${EXPO_PUBLIC_EAS_PROJECT_ID:-896b7c8b-097d-4835-bc2b-93389fb8ce6a}
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
